default_install_hook_types:
  - pre-commit
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: prettier
        name: Format Markdown and configuration files
        entry: npx prettier --write
        language: system
        files: \.(md|markdown|json|ya?ml)$
        exclude: ^themes/fluid/_config\.yml$

      - id: ejs-lint
        name: Validate EJS templates
        entry: npx ejslint
        language: system
        files: ^themes/fluid/layout/.*\.ejs$

      - id: markdownlint
        name: Lint Markdown
        entry: npx markdownlint-cli2 --fix
        language: system
        types: [markdown]

      - id: build
        name: Generate Hexo site
        entry: npm run build
        language: system
        pass_filenames: false
        files: ^(_config.*\.ya?ml|package(-lock)?\.json|source/|themes/fluid/(layout/|scripts/|source/|_config\.yml))
