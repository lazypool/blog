---
extends: default

ignore: |
  node_modules/

rules:
  # Hexo / Fluid configs intentionally omit the "---" document start.
  document-start: disable
  # Long config lines are left to prettier.
  line-length: disable
  # Prettier keeps one space inside flow mappings: `{ key: value }`.
  braces:
    max-spaces-inside: 1
