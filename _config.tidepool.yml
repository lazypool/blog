# Tidepool 主题配置
# 视觉与功能开关，具体样式在 themes/tidepool/source/css/ 中

# 顶部导航
menu:
  Home: /
  Archives: /archives/
  Photos: /photo/
  About: /about/

# 作者信息（首页侧栏 / 关于页 / 页脚）
author:
  name: LazyPool
  avatar: /img/basic/avatar.png
  bio: 一只可爱的，毛茸茸的大海龙。
  links:
    - name: GitHub
      icon: github
      url: https://github.com/lazypool
    - name: Bilibili
      icon: bilibili
      url: https://space.bilibili.com/13819285
    - name: Steam
      icon: steam
      url: https://steamcommunity.com/profiles/76561199204729755/

# 友链（左侧作者卡片中的 Friends 弹层）
friends:
  title: 友链
  items:
    - name: 寒冰是喵喵
      url: https://blog.hanbings.io
      avatar: https://blog.hanbings.io/img/avatar.jpg
      intro: 🍀 这里是寒冰，很高兴认识你！

# 首页
home:
  hero: true
  eyebrow: TIDEPOOL
  title: '' # 留空则使用站点标题
  albums: 1 # 相册数量占位，等相册系统接入后再改

# 归档：把若干年份合并成一张卡片，note 中每一项是一段
archive:
  spans:
    - years: [2023, 2024]
      note:
        - 感谢你看到这段文字。2023 到 2024，这里几乎一直空着。
        - 不是我把博客忘了，是那两年我按下了暂停键，生活里发生了一些事，我到现在也没能完全消化。
        - 有些日子很长，长到我只是坐着，等它过去。也有些时刻很短，短到一句“最近还好吗”就能把我从很低的情绪里拉出来。
        - 我一直记得这些小小的善意。所以我没有把这段空白删掉。
        - 它不好看，但它是我的一部分。谢谢你愿意翻到这里，也谢谢你在一个很久没更新的博客前停下来。
        - 如果你也正走在一段说不出口的日子里，希望你能遇到一点点光。慢一点真的没关系，潮水总会回来的。

# 搜索（本地 JSON 索引，无需额外插件）
search:
  enable: true
  path: /search.json
  placeholder: 搜索文章、标签、分类…

# 功能开关
features:
  swup: true # 局部替换 / 无刷新导航
  preload: true # 悬停预加载
  palette: true # 配色切换
  progress: true # 阅读进度条
  reveal: true # 滚动入场动画
  toc: true # 文章目录
  anchor: true # 标题锚点
  code_copy: true # 代码复制
  image_zoom: true # 图片灯箱
  reading_time: true # 阅读时长
  back_to_top: true # 返回顶部

# 数学公式（KaTeX 客户端渲染）
math:
  enable: true
  engine: katex

# 配色方案默认值：tide | abyss | coral | kelp
palette:
  default: tide

# 页脚
footer:
  since: 2023
  copyright: LazyPool
  powered_by: true
